<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NANTIS</title>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;overflow:hidden;background:#000}

/* ── Shooting Stars ───────────────────────────────── */
#nxi-stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999998;pointer-events:none}

/* ── Intro page styles ─────────────────────────────── */
#nxi{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999999;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease}
#nxi *{box-sizing:border-box;margin:0;padding:0}
#nxi-s1{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;gap:16px;padding:30px 20px 0}
#nxi-logo{width:90px;height:90px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 0 24px rgba(0,168,232,.55));animation:nxPop .8s cubic-bezier(.34,1.56,.64,1) .2s both,nxLogoGlow 3s ease-in-out 1.5s infinite}
#nxi-line{height:2px;background:#00a8e8;border-radius:2px;animation:nxGrow .8s ease .7s both}
.nxi-title{color:#f0f2f5;font-size:2.2rem;font-weight:300;letter-spacing:.25em;text-transform:uppercase;font-family:'Architects Daughter',sans-serif;animation:nxUp .7s ease 1s both}
.nxi-sub{color:rgba(240,242,245,.6);font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;font-family:sans-serif;animation:nxUp .7s ease 1.3s both}
.nxi-loc{color:rgba(240,242,245,.2);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;margin-top:4px;animation:nxUp .7s ease 1.5s both}
.nxi-btns{display:flex;gap:20px;margin-top:20px;animation:nxUp .7s ease 1.9s both}
.nxi-btn{padding:14px 64px;background:transparent;border:1px solid #00a8e8;color:#00a8e8;font-size:1rem;letter-spacing:.35em;text-transform:uppercase;text-decoration:none;font-family:'Architects Daughter',sans-serif;cursor:pointer;border-radius:2px;box-shadow:none;transition:background .3s,box-shadow .3s;-webkit-appearance:none}
.nxi-btn:hover{background:rgba(0,168,232,.1);box-shadow:0 0 20px rgba(0,168,232,.6)}
.nxi-s1-weather{color:rgba(240,242,245,.5);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;text-align:center;margin-top:12px;display:none;animation:nxUp .5s ease both}
.nxi-contact{display:flex;align-items:center;justify-content:center;gap:60px;color:rgba(240,242,245,.25);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-family:sans-serif;text-align:center;margin-top:8px;animation:nxUp .7s ease 1.6s both,nxContactGlow 3s ease-in-out 2.5s infinite}
.nxi-contact-item{display:flex;align-items:center;gap:6px}
.nxi-contact-icon{width:14px;height:14px;flex-shrink:0;filter:drop-shadow(0 0 4px rgba(0,168,232,.6));animation:nxIconGlow 3s ease-in-out 2.5s infinite}
#nxi-motto-s1{width:100%;padding:18px 24px 26px;text-align:center;flex-shrink:0;border-top:1px solid rgba(0,168,232,.15)}
#nxi-motto-s1 span{color:#00a8e8;font-size:1.35rem;letter-spacing:.12em;text-transform:uppercase;font-family:'Architects Daughter',sans-serif;animation:nxGlow 2.5s ease-in-out 2s infinite}
.nxi-tm{font-size:.4em;vertical-align:super;letter-spacing:0}

/* ── Screen 2 ──────────────────────────────────────── */
#nxi-s2{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:30px 20px;gap:14px}
.nxi-bar-wrap{width:260px}
.nxi-bar-track{width:100%;height:3px;background:rgba(0,168,232,.15);border-radius:2px}
#nxi-bar{width:0%;height:3px;background:#00a8e8;border-radius:2px;box-shadow:0 0 8px rgba(0,168,232,.8);transition:width .15s linear}
#nxi-pct{color:#00a8e8;font-size:.75rem;letter-spacing:.15em;font-family:sans-serif;text-align:center;transition:opacity .4s ease}
#nxi-status{color:rgba(240,242,245,.35);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;text-align:center;animation:nxGlow 1.5s ease-in-out infinite}
#nxi-weather{color:rgba(240,242,245,.6);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;display:none}
.nxi-nav-box{width:100%;max-width:380px;margin-top:10px}
.nxi-nav-hdr{color:rgba(240,242,245,.5);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;text-align:center;margin-bottom:10px}
.nxi-nr{margin-bottom:8px}
.nxi-nl{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;font-family:sans-serif;margin-bottom:3px}
.nxi-nbw{width:100%;height:22px;background:rgba(255,255,255,.06);border-radius:4px;position:relative;overflow:hidden}
.nxi-nbf{height:100%;width:0%;border-radius:4px;transition:width 1.8s cubic-bezier(.22,1,.36,1)}
.nxi-nbo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.nxi-nbo span{font-size:.75rem;color:#fff;font-family:sans-serif;font-weight:700}
#nxi-motto-s2{color:#00a8e8;font-size:1.35rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;font-family:'Architects Daughter',sans-serif;margin-top:20px;animation:nxGlow 2.5s ease-in-out infinite;transition:font-size 1s ease,letter-spacing 1s ease}
#nxi.nxi-fadeout{opacity:0;transition:opacity 1.2s ease}

/* ── Buy Back / Rachat ────────────────────────────── */
.nxi-buyback-box{width:100%;max-width:380px;margin-top:14px;text-align:center}
.nxi-buyback-hdr{color:rgba(240,242,245,.5);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;margin-bottom:8px}
.nxi-countdown{color:#7dd3fc;font-size:1.3rem;letter-spacing:.15em;font-family:'Architects Daughter',sans-serif;text-shadow:0 0 12px rgba(125,211,252,.5),0 0 30px rgba(125,211,252,.2);animation:nxCountGlow 2.5s ease-in-out infinite;transition:opacity .8s ease}
.nxi-buyback-msg{color:rgba(240,242,245,.7);font-size:.7rem;letter-spacing:.12em;font-family:sans-serif;line-height:1.6;margin-top:8px;opacity:0;transition:opacity 1s ease;max-width:340px;margin-left:auto;margin-right:auto}
@keyframes nxCountGlow{0%,100%{text-shadow:0 0 12px rgba(125,211,252,.4),0 0 30px rgba(125,211,252,.15)}50%{text-shadow:0 0 24px rgba(125,211,252,.9),0 0 50px rgba(125,211,252,.4)}}

/* ── Animations ────────────────────────────────────── */
@keyframes nxPop{0%{opacity:0;transform:scale(.3) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes nxUp{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nxGrow{0%{width:0}100%{width:180px}}
@keyframes nxGlow{0%,100%{color:#00a8e8;text-shadow:0 0 10px rgba(0,168,232,.3)}50%{color:#33bcf5;text-shadow:0 0 30px rgba(0,168,232,.8)}}
@keyframes nxContactGlow{0%,100%{color:rgba(240,242,245,.25);text-shadow:0 0 6px rgba(0,168,232,.15)}50%{color:rgba(240,242,245,.45);text-shadow:0 0 14px rgba(0,168,232,.4)}}
@keyframes nxIconGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(0,168,232,.4));opacity:.5}50%{filter:drop-shadow(0 0 10px rgba(0,168,232,.9));opacity:.85}}
@keyframes nxLogoGlow{0%,100%{filter:drop-shadow(0 0 24px rgba(0,168,232,.45))}50%{filter:drop-shadow(0 0 40px rgba(0,168,232,.85))}}
@keyframes nxMottoGlowFinal{0%,100%{text-shadow:0 0 20px rgba(0,168,232,.4),0 0 60px rgba(0,168,232,.15)}50%{text-shadow:0 0 40px rgba(0,168,232,.9),0 0 100px rgba(0,168,232,.4)}}

/* ── Screen 3: Quote + Motto ─────────────────────── */
#nxi-s3{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:30px 40px;gap:20px;background:url('https://nantis.ca/intro/lone%20wolf%20(1).jpg') center center / cover no-repeat;position:relative}
#nxi-s3::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55)}
#nxi-quote{opacity:0;text-align:center;max-width:600px;transition:opacity 1.2s ease;position:relative;z-index:1}
#nxi-quote-text{color:rgba(240,242,245,.55);font-size:1.05rem;letter-spacing:.06em;font-family:'Architects Daughter',sans-serif;line-height:1.7;text-shadow:0 0 15px rgba(240,242,245,.15);font-style:italic}
#nxi-quote-author{color:rgba(240,242,245,.3);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;font-family:sans-serif;margin-top:12px}
#nxi-motto-s3{opacity:0;color:#00a8e8;font-size:2rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;font-family:'Architects Daughter',sans-serif;text-shadow:0 0 30px rgba(0,168,232,.8),0 0 80px rgba(0,168,232,.3);transition:opacity 1s ease;position:relative;z-index:1}

/* ── Mobile ────────────────────────────────────────── */
@media(max-height:650px){
  #nxi-logo{width:70px;height:70px}
  .nxi-title{font-size:1.7rem}
  .nxi-sub{font-size:.7rem}
  .nxi-btns{gap:16px;margin-top:18px}
  .nxi-btn{padding:12px 40px;font-size:.88rem;letter-spacing:.3em}
  .nxi-s1-weather{font-size:.6rem;margin-top:8px}
  .nxi-contact{font-size:.6rem;gap:40px}
  #nxi-motto-s1{padding:14px 20px 18px}
  #nxi-motto-s1 span{font-size:1.1rem}
  #nxi-s2{gap:10px;padding:20px 16px}
  #nxi-motto-s2{font-size:1.1rem;margin-top:12px}
  .nxi-nbw{height:18px}
  .nxi-buyback-box{margin-top:10px}
  .nxi-countdown{font-size:1rem}
  .nxi-buyback-msg{font-size:.6rem}
  #nxi-quote-text{font-size:.88rem}
  #nxi-motto-s3{font-size:1.5rem}
}
</style>
</head>
<body>

<div id="nxi">

<script>
(function(){
  "use strict";

  /* ── Ambient Sparkles ─────────────────────────────────── */
  var canvas = document.getElementById('nxi-stars');
  var ctx = canvas.getContext('2d');
  var sparkles = [];
  var SW, SH;
  var MAX_SPARKLES = 60;

  function resizeCanvas(){
    SW = canvas.width = window.innerWidth;
    SH = canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  /* Pre-fill sparkles */
  for(var si = 0; si < MAX_SPARKLES; si++){
    sparkles.push({
      x: Math.random() * SW,
      y: Math.random() * SH,
      r: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.008 + Math.random() * 0.015,
      drift: -0.08 + Math.random() * 0.16,
      hue: Math.random() > 0.7 ? 200 : 0
    });
  }

  function drawSparkles(){
    ctx.clearRect(0, 0, SW, SH);
    for(var i = 0; i < sparkles.length; i++){
      var p = sparkles[i];
      p.phase += p.speed;
      p.y += p.drift;
      p.x += p.drift * 0.3;
      /* Wrap around */
      if(p.y < -5) p.y = SH + 5;
      if(p.y > SH + 5) p.y = -5;
      if(p.x < -5) p.x = SW + 5;
      if(p.x > SW + 5) p.x = -5;

      var alpha = 0.15 + Math.sin(p.phase) * 0.35;
      if(alpha < 0) alpha = 0;
      var glow = p.r * (1.5 + Math.sin(p.phase) * 0.8);

      if(p.hue > 0){
        /* Blue-tinted sparkle */
        ctx.fillStyle = 'rgba(140,200,255,' + alpha + ')';
        ctx.shadowColor = 'rgba(100,180,255,' + (alpha * 0.6) + ')';
      } else {
        /* White sparkle */
        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.shadowColor = 'rgba(255,255,255,' + (alpha * 0.4) + ')';
      }
      ctx.shadowBlur = glow * 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(drawSparkles);
  }

  drawSparkles();

  /* ── Daily Business Quotes ────────────────────────────── */
  var quotes = [
    { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
    { text: "In the middle of difficulty lies opportunity.", author: "Albert Einstein" },

    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "Price is what you pay. Value is what you get.", author: "Warren Buffett" },
    { text: "Innovation distinguishes between a leader and a follower.", author: "Steve Jobs" },
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "It is not the strongest that survive, but the most adaptable.", author: "Charles Darwin" },
    { text: "Compound interest is the eighth wonder of the world.", author: "Albert Einstein" },
    { text: "Fortune favors the bold.", author: "Virgil" },
    { text: "The market is a device for transferring money from the impatient to the patient.", author: "Warren Buffett" },
    { text: "Do not wait to strike till the iron is hot, but make it hot by striking.", author: "William Butler Yeats" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Opportunities don\u2019t happen. You create them.", author: "Chris Grosser" },
    { text: "The harder I work, the luckier I get.", author: "Samuel Goldwyn" },
    { text: "An investment in knowledge pays the best interest.", author: "Benjamin Franklin" },
    { text: "What we know is a drop, what we don\u2019t know is an ocean.", author: "Isaac Newton" },
    { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
    { text: "It always seems impossible until it\u2019s done.", author: "Nelson Mandela" },
    { text: "Be fearful when others are greedy and greedy when others are fearful.", author: "Warren Buffett" },
    { text: "Vision without execution is hallucination.", author: "Thomas Edison" },
    { text: "The only limit to our realization of tomorrow is our doubts of today.", author: "Franklin D. Roosevelt" },
    { text: "Great things in business are never done by one person. They\u2019re done by a team.", author: "Steve Jobs" },
    { text: "Time is more valuable than money. You can get more money, but you cannot get more time.", author: "Jim Rohn" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Wealth is the ability to fully experience life.", author: "Henry David Thoreau" },
    { text: "You miss 100% of the shots you don\u2019t take.", author: "Wayne Gretzky" },
    { text: "Discipline is the bridge between goals and accomplishment.", author: "Jim Rohn" },
    { text: "The biggest risk is not taking any risk.", author: "Mark Zuckerberg" },

    { text: "The intelligent investor is a realist who sells to optimists and buys from pessimists.", author: "Benjamin Graham" },
    { text: "Know what you own, and know why you own it.", author: "Peter Lynch" },
    { text: "The four most dangerous words in investing are: this time it\u2019s different.", author: "Sir John Templeton" },
    { text: "Wide diversification is only required when investors do not understand what they are doing.", author: "Warren Buffett" },
    { text: "In investing, what is comfortable is rarely profitable.", author: "Robert Arnott" },

    { text: "Your most unhappy customers are your greatest source of learning.", author: "Bill Gates" },
    { text: "Stay hungry, stay foolish.", author: "Steve Jobs" },
    { text: "Move fast and break things. Unless you are breaking stuff, you are not moving fast enough.", author: "Mark Zuckerberg" },
    { text: "The best investment you can make is in yourself.", author: "Warren Buffett" },
    { text: "I never dreamed about success. I worked for it.", author: "Est\u00e9e Lauder" },
    { text: "Don\u2019t be afraid to give up the good to go for the great.", author: "John D. Rockefeller" },
    { text: "A business that makes nothing but money is a poor business.", author: "Henry Ford" },
    { text: "Capital isn\u2019t scarce; vision is.", author: "Sam Walton" },

    { text: "Most of the important things in the world have been accomplished by people who have kept on trying when there seemed to be no hope at all.", author: "Dale Carnegie" },
    { text: "Any fool can criticize, complain, and condemn, and most fools do. But it takes character and self-control to be understanding and forgiving.", author: "Dale Carnegie" },

    { text: "The only real mistake is the one from which we learn nothing.", author: "Henry Ford" },
    { text: "Success is how high you bounce when you hit bottom.", author: "George S. Patton" },
    { text: "An army of sheep led by a lion can defeat an army of lions led by a sheep.", author: "African Proverb" },
    { text: "If you look at what you have in life, you\u2019ll always have more.", author: "Oprah Winfrey" },
    { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey" },
    { text: "The biggest adventure you can take is to live the life of your dreams.", author: "Oprah Winfrey" },
    { text: "Surround yourself with only people who are going to lift you higher.", author: "Oprah Winfrey" },
    { text: "Be thankful for what you have; you\u2019ll end up having more.", author: "Oprah Winfrey" },
    { text: "I don\u2019t think of work as work and play as play. It\u2019s all living.", author: "Richard Branson" },
    { text: "Take risks. If you win, you will be happy. If you lose, you will be wise.", author: "Ancient Proverb" },
    { text: "Not all who wander are lost.", author: "J.R.R. Tolkien" },
    { text: "The true test of character is not how much we know how to do, but how we behave when we don\u2019t know what to do.", author: "John Holt" },
    { text: "Good things come to people who wait, but better things come to those who go out and get them.", author: "Abraham Lincoln" },
    { text: "Give me six hours to chop down a tree and I will spend the first four sharpening the axe.", author: "Abraham Lincoln" },
    { text: "Nearly all men can stand adversity, but if you want to test a man\u2019s character, give him power.", author: "Abraham Lincoln" },
    { text: "The best thing about the future is that it comes one day at a time.", author: "Abraham Lincoln" },
    { text: "Whatever you are, be a good one.", author: "Abraham Lincoln" },

    { text: "I walk slowly, but I never walk backward.", author: "Abraham Lincoln" },

    { text: "To handle yourself, use your head; to handle others, use your heart.", author: "Eleanor Roosevelt" }
  ];

  var dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / 86400000);
  var todayQuote = quotes[dayOfYear % quotes.length];

  /* ── Cookie helper ──────────────────────────────────── */
  function getCookie(name){
    var v = document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
    return v ? v.pop() : '';
  }
  function setCookie(name, val, minutes){
    var d = new Date();
    d.setTime(d.getTime() + minutes*60*1000);
    document.cookie = name+'='+val+';expires='+d.toUTCString()+';path=/;domain=.nantis.ca;SameSite=Lax;Secure';
  }

  /* Loop guard: if intro already played this session but PHP/cache re-served it,
     skip straight to homepage with ?nxi=1 to bypass the PHP snippet URI check. */
  if(sessionStorage.getItem('nxi_done')){
    document.getElementById('nxi').style.display='none';
    var lang = sessionStorage.getItem('nxi_lang') || 'en';
    var base = window.location.origin + (lang === 'fr' ? '/fr/' : '/');
    window.location.replace(base + '?nxi=1');
    return;
  }

  var g = document.getElementById.bind(document);
  var ov = g('nxi'), s1 = g('nxi-s1'), s2 = g('nxi-s2');
  var motto1 = g('nxi-motto-s1');
  var bar = g('nxi-bar'), pctEl = g('nxi-pct'), statusEl = g('nxi-status');

  if (!ov) return;

  document.body.style.overflow = 'hidden';
  document.documentElement.style.overflow = 'hidden';

  /* ── Language buttons ──────────────────────────────── */

  var targetLang = '';

  var btns = document.querySelectorAll('.nxi-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function(e){
      e.preventDefault();
      targetLang = this.getAttribute('data-lang');

      /* Set cookie — 30 minute expiry */
      setCookie('nx_intro','1',30);

      /* ── Black hole effect: everything gets sucked into the logo ── */
      var logo = g('nxi-logo');
      var logoRect = logo.getBoundingClientRect();
      var cx = logoRect.left + logoRect.width/2;
      var cy = logoRect.top + logoRect.height/2;

      /* Elements to swallow — everything on Screen 1 except the logo */
      var targets = s1.querySelectorAll('.nxi-title, .nxi-sub, .nxi-loc, .nxi-btns, .nxi-btn, .nxi-s1-weather, .nxi-contact, #nxi-line');
      var mottoSpan = motto1.querySelector('span');

      /* Animate each element toward the logo center */
      targets.forEach(function(el){
        var cs = window.getComputedStyle(el);
        if(cs.display === 'inline') el.style.display = 'inline-block';
        var r = el.getBoundingClientRect();
        var ex = r.left + r.width/2;
        var ey = r.top + r.height/2;
        var dx = cx - ex;
        var dy = cy - ey;
        el.style.transition = 'transform .8s cubic-bezier(.6,.04,.98,.34), opacity .7s ease';
        el.style.transformOrigin = 'center center';
        el.style.transform = 'translate('+dx+'px,'+dy+'px) scale(0)';
        el.style.opacity = '0';
      });

      /* Swallow the motto too */
      if(mottoSpan){
        mottoSpan.style.display = 'inline-block';
        var mr = mottoSpan.getBoundingClientRect();
        var mdx = cx - (mr.left + mr.width/2);
        var mdy = cy - (mr.top + mr.height/2);
        mottoSpan.style.transition = 'transform .8s cubic-bezier(.6,.04,.98,.34), opacity .7s ease';
        mottoSpan.style.transform = 'translate('+mdx+'px,'+mdy+'px) scale(0)';
        mottoSpan.style.opacity = '0';
      }

      /* Logo pulses as it absorbs everything */
      logo.style.transition = 'transform .6s ease .2s, filter .6s ease .2s';
      logo.style.transform = 'scale(1.15)';
      logo.style.filter = 'drop-shadow(0 0 40px rgba(0,168,232,.9)) brightness(1.3)';

      /* After absorption, logo shrinks away and we transition */
      setTimeout(function(){
        logo.style.transition = 'transform .5s cubic-bezier(.6,.04,.98,.34), opacity .4s ease .1s';
        logo.style.transform = 'scale(0)';
        logo.style.opacity = '0';
      }, 900);

      setTimeout(function(){
        s1.style.display = 'none';
        motto1.style.display = 'none';
        s2.style.display = 'flex';
        s2.style.opacity = '0';
        s2.style.transition = 'opacity .5s ease';
        requestAnimationFrame(function(){ s2.style.opacity = '1'; });
        startLoading();
      }, 1400);
    });
  }

  /* ── Progress ──────────────────────────────────────── */

  var progress = 0, barTimer = null;

  function setProgress(v){
    progress = Math.min(v,100);
    bar.style.width = Math.round(progress)+'%';
    pctEl.textContent = Math.round(progress)+'%';
  }

  function animProgress(target, ms){
    var start = progress, t0 = Date.now();
    if (barTimer) clearInterval(barTimer);
    barTimer = setInterval(function(){
      var p = Math.min((Date.now()-t0)/ms,1);
      setProgress(start+(target-start)*p);
      if (p>=1) clearInterval(barTimer);
    },30);
  }

  var navDone = false, weatherDone = false;

  function checkDone(){
    if (navDone && weatherDone){ animProgress(100,400); setTimeout(doExit,3500); }
  }

  function startLoading(){
    animProgress(25,1200);
    loadNAV();
    loadWeatherForS2();
    setTimeout(doExit,10000);
  }

  /* ── NAV ───────────────────────────────────────────── */

  function loadNAV(){
    var url = 'https://docs.google.com/spreadsheets/d/e/' +
      '2PACX-1vQT6dFLvqEDKW6UBHoMsr237H3mFu1WjmfKDOCJT1KGf2AQV3eU3jMFQQta_J8qGE9KCAadjIEZXoms' +
      '/pub?output=csv';
    var x = new XMLHttpRequest();
    x.open('GET','https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url));
    x.timeout = 8000;
    x.onload = function(){
      navDone = true;
      if (x.status<200||x.status>=300){setProgress(60);checkDone();return;}
      var lines = x.responseText.trim().split('\n');
      if (lines.length<2){setProgress(60);checkDone();return;}
      var vals = lines[1].split(',');
      var raised = parseFloat((vals[0]||'').replace(/[$,%\s]/g,''));
      var net = parseFloat((vals[1]||'').replace(/[$,%\s]/g,''));
      if (isNaN(raised)||isNaN(net)||net===0){setProgress(60);checkDone();return;}
      var cF=(net/raised)*100, cA=cF*0.9475;
      animProgress(60,500);
      animNAV('nxi-ba','nxi-ad','nxi-ap',cA,200);
      animNAV('nxi-bf','nxi-fd','nxi-fp',cF,500);
      checkDone();
    };
    x.onerror = x.ontimeout = function(){navDone=true;setProgress(60);checkDone();};
    x.send();
  }

  function fmt(n){return '$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});}

  function animNAV(fillId,dId,pId,val,delay){
    setTimeout(function(){
      var fill=g(fillId),dEl=g(dId),pEl=g(pId);
      if(!fill||!dEl||!pEl)return;
      fill.style.width=Math.min(val,100)+'%';
      var t0=performance.now();
      (function step(ts){
        var p=Math.min((ts-t0)/1800,1), v=1-Math.pow(1-p,3);
        dEl.textContent=fmt(val*v);
        pEl.textContent=(val*v).toFixed(2)+'%';
        if(p<1)requestAnimationFrame(step);
      })(t0);
    },delay);
  }

  /* ── Weather ───────────────────────────────────────── */

  var weatherText = '';

  function fetchWeatherNow(){
    var x = new XMLHttpRequest();
    x.open('GET','https://ipapi.co/json/');
    x.timeout = 5000;
    x.onload = function(){
      if(x.status<200||x.status>=300)return;
      try{
        var d=JSON.parse(x.responseText);
        if(!d.city||d.latitude==null)return;
        var x2=new XMLHttpRequest();
        x2.open('GET','https://api.open-meteo.com/v1/forecast?latitude='+d.latitude+'&longitude='+d.longitude+'&current_weather=true');
        x2.timeout=5000;
        x2.onload=function(){
          try{
            var wd=JSON.parse(x2.responseText);
            if(wd.current_weather){
              weatherText=d.city+'  |  '+Math.round(wd.current_weather.temperature)+'\u00B0C';
              var s1w=g('nxi-s1-weather');
              if(s1w){s1w.textContent=weatherText;s1w.style.display='block';}
            }
          }catch(e){}
        };
        x2.onerror=x2.ontimeout=function(){};
        x2.send();
      }catch(e){}
    };
    x.onerror=x.ontimeout=function(){};
    x.send();
  }

  fetchWeatherNow();

  function loadWeatherForS2(){
    if(weatherText){
      var el=g('nxi-weather');
      if(el){el.textContent=weatherText;el.style.display='block';}
      weatherDone=true; setProgress(Math.max(progress,85)); checkDone(); return;
    }
    var waited=0;
    var poll=setInterval(function(){
      waited+=300;
      if(weatherText){
        clearInterval(poll);
        var el=g('nxi-weather');
        if(el){el.textContent=weatherText;el.style.display='block';}
        weatherDone=true;setProgress(Math.max(progress,85));checkDone();
      }else if(waited>=4000){
        clearInterval(poll);weatherDone=true;setProgress(Math.max(progress,80));checkDone();
      }
    },300);
  }

  /* ── Countdown – Buy Back / Rachat ──────────────────── */

  var countdownTarget = new Date('2026-06-01T09:30:00-04:00').getTime(); // June 1, 2026 9:30 AM EST (EDT)
  var countdownEl = g('nxi-countdown');
  var buybackMsg = g('nxi-buyback-msg');
  var countdownExpired = false;

  function padZ(n){ return n < 10 ? '0' + n : '' + n; }

  function updateCountdown(){
    var now = Date.now();
    var diff = countdownTarget - now;
    if(diff <= 0){
      if(!countdownExpired){
        countdownExpired = true;
        countdownEl.textContent = '00 : 00 : 00 : 00';
        countdownEl.style.opacity = '0.3';
        /* Show language-specific message */
        if(targetLang === 'fr'){
          buybackMsg.textContent = 'Veuillez vendre vos parts via votre plateforme de courtage en tant qu\u2019ordre au march\u00e9. La S.E.C. (NANTIS 2025) les rach\u00e8tera \u00e0 la valeur liquidative finale.';
        } else {
          buybackMsg.textContent = 'Please sell your shares via your trading platform as a market order. The LP (NANTIS 2025) will be buying them back at the final NAV value.';
        }
        buybackMsg.style.opacity = '1';
      }
      return;
    }
    var d = Math.floor(diff / 86400000);
    var h = Math.floor((diff % 86400000) / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    countdownEl.textContent = padZ(d) + ' : ' + padZ(h) + ' : ' + padZ(m) + ' : ' + padZ(s);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* ── Exit ──────────────────────────────────────────── */

  var exited = false;

  function doExit(){
    if(exited)return; exited=true;
    if(barTimer)clearInterval(barTimer);
    setProgress(100);

    setTimeout(function(){
      /* Fade out entire Screen 2 */
      s2.style.transition = 'opacity .6s ease';
      s2.style.opacity = '0';

      setTimeout(function(){
        s2.style.display = 'none';

        /* Show Screen 3 */
        var s3 = g('nxi-s3');
        s3.style.display = 'flex';

        /* Show daily quote */
        var quoteEl = g('nxi-quote');
        var quoteText = g('nxi-quote-text');
        var quoteAuthor = g('nxi-quote-author');
        quoteText.textContent = '\u201C' + todayQuote.text + '\u201D';
        quoteAuthor.textContent = '\u2014 ' + todayQuote.author;

        setTimeout(function(){ quoteEl.style.opacity = '1'; }, 300);

        /* After 6 seconds, fade out quote and show motto */
        setTimeout(function(){
          quoteEl.style.opacity = '0';

          setTimeout(function(){
            quoteEl.style.display = 'none';
            var mottoS3 = g('nxi-motto-s3');
            mottoS3.style.opacity = '1';
            mottoS3.style.animation = 'nxMottoGlowFinal 2.5s ease-in-out infinite';

            /* Redirect after motto displays */
            setTimeout(function(){
              sessionStorage.setItem('nxi_done','1');
              sessionStorage.setItem('nxi_lang', targetLang);
              window.location.href = window.location.origin + (targetLang === 'fr' ? '/fr/' : '/');
            }, 2500);
          }, 1000);
        }, 6000);
      }, 700);
    }, 500);
  }

})();
</script>
